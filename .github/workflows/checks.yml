name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    # Any 3.x is fine: the app is stdlib only. The matrix pins the two versions
    # the author actually runs: `python3` on this laptop (3.10) and run.sh's
    # managed interpreter (3.13).
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
        node-version: ["20"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - run: python3 -m py_compile app/*.py app/api/*.py app/providers/*.py

      - run: python3 app/tools.py test

      - run: python3 -W error::ResourceWarning -m unittest discover

      - run: node --check web/app.js

      - run: node tests/check_ui.mjs
